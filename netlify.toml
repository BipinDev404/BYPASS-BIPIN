[build]
  command = "node build.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Match the dev server: never cache the downloadable extension archive,
# so visitors always get the freshly built zip.
[[headers]]
  for = "/bypass-extension.zip"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"
